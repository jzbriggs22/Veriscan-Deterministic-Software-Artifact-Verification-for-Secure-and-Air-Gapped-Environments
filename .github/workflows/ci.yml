name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (veriscan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup resolves the toolchain (and rustfmt/clippy components)
      # from rust-toolchain.toml automatically.
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Blocking: the lockfile is audited; the only unpatchable advisory
      # (RUSTSEC-2023-0071) is ignored with justification in .cargo/audit.toml.
      # cargo-audit is pinned to 0.22.1 — 0.22.2+ requires rustc 1.88, newer
      # than the 1.86 toolchain pinned by rust-toolchain.toml.
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo audit

  python:
    name: Python (ai-governance-mvp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-governance-mvp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-governance-mvp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest.ini enforces the 90% coverage gate via addopts.
      - name: Tests with coverage gate
        run: python -m pytest
